[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i18n-translator"
version = "1.0.0"
description = "Generate frontend i18n resource files by translating JSON with the DeepL API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Vincent AGI" }]
keywords = ["i18n", "l10n", "translation", "deepl", "json", "localization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Software Development :: Localization",
    "Environment :: Console",
]
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
i18n-translate = "i18n_translator.cli:main"

[project.urls]
Repository = "https://github.com/vincent-agi/I18nWebsiteAutoTranslator"

[tool.hatch.build.targets.wheel]
packages = ["src/i18n_translator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
